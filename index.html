<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Документ</title>
<style>:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;
font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#6c6c72}</style>
</head><body><p id="m">Загрузка…</p><script>
(async () => {
  const m = document.getElementById('m');
  try {
    const k = location.hash.slice(1).replace(/-/g, '+').replace(/_/g, '/');
    const raw = Uint8Array.from(atob(k), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const buf = new Uint8Array(await (await fetch('d.bin', {cache: 'no-cache'})).arrayBuffer());
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: buf.slice(0, 12)}, key, buf.slice(12)));
    document.open(); document.write(html); document.close();
  } catch (e) {
    m.textContent = 'Ссылка неполная или устарела.';
  }
})();
</script></body></html>
